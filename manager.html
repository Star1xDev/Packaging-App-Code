<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3498db">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="manager.css">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <title>Manager Dashboard</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">🏠 Packager</a></li>
            <li><a href="manager.html" class="active">📦 Manager</a></li>
            <li><a href="returns.html">🔄 Returns</a></li>
        </ul>
    </nav>

    <header>
        <h1>Manager Dashboard</h1>
        <p>System Control Center</p>
    </header>

    <div class="manager-container">
        <div class="manager-tabs">
            <button class="tab-btn active" data-tab="packaging">Packaging</button>
            <button class="tab-btn" data-tab="returns">Returns</button>
        </div>

        <div id="packaging-tab" class="tab-content active">
            <div class="action-bar">
                <button id="generate-packaging">Update</button>
                <button id="archive-packaging" class="btn-primary">📁 Archive</button>
                <button id="reset-packaging" class="btn-danger">🔄 Reset</button>
            </div>
            
            <div class="table-container">
                <table id="packaging-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Variant</th>
                            <th>Packaged</th>
                            <th>Used Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="returns-tab" class="tab-content">
            <div class="action-bar">
                <button id="generate-returns">Update</button>
                <button id="archive-returns" class="btn-primary">📁 Archive</button>
                <button id="reset-returns" class="btn-danger">🔄 Reset</button>
            </div>
            
            <div class="table-container">
                <table id="returns-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Variant</th>
                            <th>Returned</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="archive-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3 id="modal-title">Archive Summary</h3>
                <div class="summary-card" id="data-summary">
                    <h4 id="summary-type">📦 Packaging Data</h4>
                    <div class="summary-stats">
                        <span><strong>Products:</strong> <span id="product-count">0</span></span>
                        <span><strong>Units:</strong> <span id="unit-count">0</span></span>
                    </div>
                </div>
                <div class="modal-actions">
                    <label class="checkbox-container">
                        <input type="checkbox" id="reset-after-archive" checked>
                        <span>Reset quantities after archiving</span>
                    </label>
                    <button id="confirm-archive" class="btn-primary">Confirm Archive</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="manager.js"></script>
</body>
</html>
