<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Manifest -->
    <link rel="manifest" href="./Manifest.json" crossorigin="use-credentials">
    <!-- iOS Safari PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Theme Color -->
    <meta name="theme-color" content="#3498db">
    <title>Packaging App</title>
    <link rel="stylesheet" href="styles.css"> <!-- Include CSS -->
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#packager" class="active">🏠 Packager</a></li>
            <li><a href="#manager">📦 Manager</a></li>
            <li><a href="#returns">🔄 Returns</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header>
        <h1>Packaging App</h1>
        <p>Total Packaged Today: <span id="total-packaged">0</span> units</p>
    </header>

    <!-- Barcode Section -->
    <div class="barcode-section">
        <input type="text" id="product-name-input" placeholder="Type product name" autofocus>
        <div id="autocomplete-suggestions" class="autocomplete-dropdown"></div>
        <button id="scan-barcode">Scan</button>
    </div>

    <!-- Product Details Section -->
    <div id="product-details" style="display: none;">
        <h2>Product Details</h2>
        <p id="product-name"></p>

        <!-- Variant Selection -->
        <div id="variant-options"></div>

        <!-- Display Current Values -->
        <p>Current Packaged Quantity: <span id="current-packaged"></span></p>
        <p>Current Used Stock: <span id="current-used"></span></p>

        <!-- Input Fields for New Values -->
        <div>
            <label for="packaged-quantity">Packaged Quantity:</label>
            <input type="number" id="packaged-quantity" placeholder="Enter quantity" min="0">
        </div>
        <div>
            <label for="used-stock">Used Stock:</label>
            <input type="number" id="used-stock" placeholder="Enter used stock" min="0">
        </div>

        <!-- Toggle Button for Addition/Subtraction -->
        <button id="toggle-operation">+ Add</button>
        <br>

        <!-- Save and Cancel Buttons -->
        <button id="save-packaging">Save</button>
        <button id="cancel-scan">Cancel</button>

        <!-- Save Spinner -->
        <div class="loading-spinner" id="save-spinner">
            <p>Saving...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Admin Actions Section -->
    <div class="admin-actions">
        <button id="generate-packaging">Generate Packaging Collection</button>
        <button id="reset-packaging">Reset Packaging Data</button>
        <button id="toggle-packaging-table">Show Packaging Table</button>
    </div>

    <!-- Packaging Table Section -->
    <div id="packaging-table-container" style="display: none;">
        <h2>Packaging Data</h2>
        <table id="packaging-table">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Variant Name</th>
                    <th>Packaged Quantity</th>
                    <th>Used Stock</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loading-spinner">
        <p>Loading...</p>
        <div class="spinner"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" style="display: none;">
        <p id="modal-message"></p>
        <button id="confirm-action">Yes, Confirm</button>
        <button id="cancel-action">Cancel</button>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/Packaging-App-Code/sw.js', { scope: '/Packaging-App-Code/' })
              .then(reg => console.log('SW registered:', reg))
              .catch(err => console.log('SW failed:', err));
          });
        }
      </script>
</body>
</html>
