<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA Configuration -->
    <link rel="manifest" href="/Packaging-App-Code/Manifest.json" crossorigin="use-credentials">
    <meta name="theme-color" content="#3498db">
    
    <!-- iOS PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    
    <!-- Styles & Favicons -->
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    
    <title>Returns Processing</title>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="index.html">🏠 Packager</a></li>
            <li><a href="manager.html">📦 Manager</a></li>
            <li><a href="returns.html" class="active">🔄 Returns</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header>
        <h1>Returns Processing</h1>
        <p>Total Returns Today: <span id="total-returns">0</span> units</p>
    </header>

    <!-- Product Search Section -->
    <div class="barcode-section">
        <input type="text" id="product-name-input" placeholder="Type product name" autofocus>
        <div id="autocomplete-suggestions" class="autocomplete-dropdown"></div>
        <button id="find-product">Find</button>
    </div>

    <!-- Product Details Section -->
    <div id="product-details" style="display: none;">
        <h2>Return Details</h2>
        <p id="product-name"></p>

        <!-- Variant Selection Chips -->
        <div id="variant-selector"></div>

        <!-- Display Current Values -->
        <p>Current Returned Quantity: <span id="current-returned">0</span></p>

        <!-- Input Field -->
        <div>
            <label for="returned-qty">Returned Quantity:</label>
            <input type="number" id="returned-qty" placeholder="Enter quantity" min="0">
        </div>

        <!-- Toggle Button -->
        <button id="toggle-operation">+ Add</button>
        <br>

        <!-- Save and Cancel Buttons -->
        <button id="save-return">Save Return</button>
        <button id="cancel-return">Cancel</button>

        <!-- Save Spinner -->
        <div class="loading-spinner" id="save-spinner">
            <p>Saving...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Admin Actions -->
    <div class="admin-actions">
        <button id="generate-returns">Initialize Returns Collection</button>
        <button id="reset-returns">Reset Returns Data</button>
        <button id="toggle-returns-table">Show Returns Table</button>
    </div>

    <!-- Returns Table -->
    <div id="returns-table-container" style="display: none;">
        <h2>
            Returns Data
            <button id="undo-button" disabled style="background: #ff9800; margin-left: 10px;">↩ Undo</button>
            <button id="redo-button" disabled style="background: #4CAF50; margin-left: 5px;">↪ Redo</button>
        </h2>
        <table id="returns-table">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Variant Name</th>
                    <th>Returned Quantity</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loading-spinner">
        <p>Loading...</p>
        <div class="spinner"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" style="display: none;">
        <p id="modal-message"></p>
        <button id="confirm-action">Yes, Confirm</button>
        <button id="cancel-action">Cancel</button>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="returns.js"></script>
</body>
</html>
